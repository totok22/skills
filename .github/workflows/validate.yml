name: Validate skills

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate skills
        run: python3 tools/validate_skills.py
      - name: Run skill script tests
        run: |
          for scripts_dir in skills/*/scripts; do
            if [ -d "$scripts_dir" ]; then
              python3 -m unittest discover -s "$scripts_dir" -p 'test_*.py' -v
            fi
          done
